name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test, and build (macOS 26 / Xcode 26)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate configuration
        run: make validate

      - name: Run unit tests
        run: make test-logic

      - name: Build (Debug)
        run: make build

      - name: Build Release app (universal)
        run: make build CONFIGURATION=Release

      - name: Smoke test (launch, verify, quit)
        run: |
          open .build/Build/Products/Release/WinFinder.app
          for i in $(seq 1 10); do
            sleep 1
            pgrep -x WinFinder >/dev/null && break
          done
          pgrep -x WinFinder || { echo "WinFinder did not launch" >&2; exit 1; }
          osascript -e 'tell application "WinFinder" to quit' || true
          sleep 2
          if pgrep -x WinFinder >/dev/null; then
            echo "graceful quit did not finish; killing"
            pkill -x WinFinder
          fi

      - name: Zip app bundle
        run: |
          cd .build/Build/Products/Release
          /usr/bin/ditto -c -k --keepParent WinFinder.app WinFinder.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinFinder-macOS
          path: .build/Build/Products/Release/WinFinder.zip
          if-no-files-found: error
